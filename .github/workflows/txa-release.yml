# Build standalone txapm.exe / txacreate.exe from tools/ and publish a GitHub Release.
# Trigger: push a tag such as v1.0.0. install.ps1 downloads these assets and verifies
# them against SHA256SUMS.txt.
name: TXA Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
          - arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: pwsh
        working-directory: tools
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: ${{ matrix.arch }}

      - name: Bake release defaults into txa/_build.py
        env:
          UPSTREAM: ${{ github.repository }}
          CLIENT_ID: ${{ vars.TXA_GITHUB_CLIENT_ID }}
        run: |
          @(
            '"""Generated by the release workflow - do not commit."""'
            "UPSTREAM_REPO = `"$env:UPSTREAM`""
            "GITHUB_CLIENT_ID = `"$env:CLIENT_ID`""
          ) | Set-Content -Encoding utf8 src/txa/_build.py

      - name: Install
        run: python -m pip install --disable-pip-version-check ".[dev,build]"

      - name: Test
        run: python -m pytest -q

      - name: Build executables
        run: |
          foreach ($tool in 'txapm', 'txacreate') {
            pyinstaller --noconfirm --onefile --console --name $tool --collect-data txa --hidden-import txa._build "packaging/$tool.py"
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
          & dist/txapm.exe --version
          Compress-Archive -Path dist/txapm.exe, dist/txacreate.exe -DestinationPath "txa-windows-${{ matrix.arch }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: txa-windows-${{ matrix.arch }}
          path: tools/txa-windows-${{ matrix.arch }}.zip

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum *.zip | tee SHA256SUMS.txt

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/*.zip dist/SHA256SUMS.txt install.ps1 --title "TXA $TAG" --generate-notes
