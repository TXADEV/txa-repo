# TXA Progress - the live checklist on a pull request.
#
# Runs on pull_request_target: default-branch code with a write token. It NEVER checks out or
# executes anything from the pull request - it only reads the Actions API about the unprivileged
# "TXA Validate" run and keeps the bot's comment current. The final report comes from "TXA Gate".
name: TXA Progress

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:         # started by "TXA Agreement" the moment the author accepts it
    inputs:
      pr:
        description: Pull request number
        required: true
      sha:
        description: Head commit of the pull request
        required: true

permissions:
  contents: read
  actions: read
  checks: write
  issues: write
  pull-requests: write

concurrency:
  group: txa-progress-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

jobs:
  watch:
    name: live progress
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    env:
      APP_ID: ${{ secrets.TXA_APP_ID }}
    timeout-minutes: 45
    steps:
      # pull_request_target checks out the *base* branch by default - exactly what we want here.
      - uses: actions/checkout@v7
        with:
          sparse-checkout: tools
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install trusted TXA toolchain
        run: python -m pip install --disable-pip-version-check ./tools

      - name: Bot identity (GitHub App - optional, falls back to the workflow token)
        id: app
        if: env.APP_ID != ''
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.TXA_APP_ID }}
          private-key: ${{ secrets.TXA_APP_PRIVATE_KEY }}

      - name: Follow the validation run
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || inputs.sha }}
        run: txaci gate progress --pr "$PR_NUMBER" --head-sha "$HEAD_SHA"
