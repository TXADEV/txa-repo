# Unit tests for tools/ (txapm, txacreate, txaci).
name: TXA Tools CI

on:
  push:
    branches: [main]
    paths: ["tools/**"]
  pull_request:
    paths: ["tools/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: pytest · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: tools
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check ".[dev]"
      - run: python -m pytest -q
      - name: Validate the example release offline
        run: txaci validate ../examples/manifests/t/TXAVL/HelloTool/1.4.2 --offline
