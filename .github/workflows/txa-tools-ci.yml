# Smoke checks for tools/ (txapm, txacreate, txaci): the package installs, the commands start, and
# every manifest in the repository still passes the offline checks.
name: TXA Tools CI

on:
  push:
    branches: [main]
    paths: ["tools/**"]
  pull_request:
    paths: ["tools/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: smoke · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: tools
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install --disable-pip-version-check .

      - name: The three commands start
        run: |
          txapm --version
          txacreate --version
          txaci --version

      - name: Example release validates offline
        run: txaci validate ../examples/manifests/t/TXAVL/HelloTool/1.4.2 --offline

      - name: Every manifest in the repository validates offline
        run: |
          for release in ../manifests/t/*/*/*; do
            [ -d "$release" ] || continue
            txaci validate "$release" --offline > /dev/null || { echo "::error::$release failed"; txaci validate "$release" --offline; exit 1; }
          done
